
name: Android 15 Cloud Phone

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  android-cloud:
    runs-on: ubuntu-22.04
    timeout-minutes: 350

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            openjdk-17-jdk \
            xvfb \
            x11vnc \
            novnc \
            websockify \
            unzip \
            wget \
            curl

      - name: Setup Android SDK
        shell: bash
        run: |
          export ANDROID_HOME="$HOME/android-sdk"
          mkdir -p "$ANDROID_HOME/cmdline-tools"

          wget -q \
            https://dl.google.com/android/repository/commandlinetools-linux-13114758_latest.zip \
            -O /tmp/android-sdk.zip

          unzip -q /tmp/android-sdk.zip -d /tmp/android-cmd
          mkdir -p "$ANDROID_HOME/cmdline-tools/latest"
          mv /tmp/android-cmd/cmdline-tools/* \
            "$ANDROID_HOME/cmdline-tools/latest/"

          echo "ANDROID_HOME=$ANDROID_HOME" >> "$GITHUB_ENV"
          echo "$ANDROID_HOME/platform-tools" >> "$GITHUB_PATH"
          echo "$ANDROID_HOME/emulator" >> "$GITHUB_PATH"
          echo "$ANDROID_HOME/cmdline-tools/latest/bin" >> "$GITHUB_PATH"

          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses || true

          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" \
            "platform-tools" \
            "platforms;android-35" \
            "emulator" \
            "system-images;android-35;google_apis;x86_64"

      - name: Create Android 15 Device
        run: |
          echo no | avdmanager create avd \
            -n CloudAndroid15 \
            -k "system-images;android-35;google_apis;x86_64" \
            --device "pixel_2"

      - name: Start Android Emulator
        shell: bash
        run: |
          export DISPLAY=:0

          Xvfb :0 -screen 0 1280x800x24 &
          sleep 3

          emulator -avd CloudAndroid15 \
            -gpu swiftshader_indirect \
            -no-audio \
            -no-boot-anim \
            -accel off \
            > emulator.log 2>&1 &

          adb wait-for-device

          for i in $(seq 1 180); do
            if [ "$(adb shell getprop sys.boot_completed 2>/dev/null | tr -d '\r')" = "1" ]; then
              break
            fi
            sleep 5
          done

          if [ "$(adb shell getprop sys.boot_completed | tr -d '\r')" != "1" ]; then
            echo "Android boot failed"
            tail -100 emulator.log
            exit 1
          fi

          adb shell wm size 1280x800
          adb shell wm density 240

      - name: Install APK (Optional)
        run: |
          if [ -f "apks/app.apk" ]; then
            adb install -r apks/app.apk
          else
            echo "No APK found. Install apps through Android browser."
          fi

      - name: Configure VNC Password
        shell: bash
        env:
          VNC_PASSWORD: ${{ secrets.VNC_PASSWORD }}
        run: |
          if [ -z "$VNC_PASSWORD" ]; then
            echo "Set VNC_PASSWORD GitHub secret first"
            exit 1
          fi

          mkdir -p "$HOME/.vnc"
          x11vnc -storepasswd "$VNC_PASSWORD" "$HOME/.vnc/passwd"

      - name: Start VNC Server
        run: |
          x11vnc \
            -display :0 \
            -forever \
            -shared \
            -rfbport 5900 \
            -rfbauth "$HOME/.vnc/passwd" \
            -noxdamage \
            > vnc.log 2>&1 &

          sleep 3

      - name: Connect Tailscale
        uses: tailscale/github-action@v3
        with:
          authkey: ${{ secrets.TAILSCALE_AUTH_KEY }}
          args: --hostname=android15-cloud-${{ github.run_id }}

      - name: Start Browser VNC
        shell: bash
        run: |
          /usr/share/novnc/utils/novnc_proxy \
            --listen 6080 \
            --vnc localhost:5900 \
            > novnc.log 2>&1 &

          sleep 5

          TS_IP=$(tailscale ip -4 | head -n 1)

          echo "=================================="
          echo "ANDROID 15 CLOUD PHONE"
          echo "Browser: http://$TS_IP:6080/vnc.html"
          echo "VNC Port: 5900"
          echo "Username: Not required"
          echo "Password: Your VNC_PASSWORD"
          echo "=================================="

      - name: Keep Android Running
        run: |
          while true; do
            adb get-state
            sleep 60
          done
