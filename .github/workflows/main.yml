
name: Android 15 Cloud VNC

on:
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  android-cloud:
    name: Android 15 Emulator
    runs-on: ubuntu-22.04
    timeout-minutes: 350

    steps:
      # 1. Download repository
      - name: Checkout Repository
        uses: actions/checkout@v4

      # 2. Install Java 17 (important SDK manager fix)
      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      # 3. Install required Linux packages
      - name: Install Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            curl \
            unzip \
            xvfb \
            x11vnc \
            openbox \
            novnc \
            websockify

      # 4. Verify Java
      - name: Verify Java
        run: |
          echo "Java location:"
          which java
          java -version

          JAVA_VERSION=$(java -version 2>&1 | head -n 1)
          echo "$JAVA_VERSION"

          java -version 2>&1 | grep -q '17' || {
            echo "ERROR: Java 17 is required!"
            exit 1
          }

      # 5. Install Android SDK
      - name: Setup Android SDK
        shell: bash
        run: |
          set -e

          export ANDROID_HOME="$HOME/android-sdk"
          export ANDROID_SDK_ROOT="$ANDROID_HOME"

          mkdir -p "$ANDROID_HOME/cmdline-tools"
          cd "$ANDROID_HOME"

          curl -fLo tools.zip \
            https://dl.google.com/android/repository/commandlinetools-linux-13114758_latest.zip

          unzip -q tools.zip
          mkdir -p cmdline-tools/latest
          mv cmdline-tools/bin cmdline-tools/lib cmdline-tools/latest/
          mv cmdline-tools/NOTICE.txt cmdline-tools/latest/ 2>/dev/null || true
          mv cmdline-tools/source.properties cmdline-tools/latest/ 2>/dev/null || true
          rm -f tools.zip

          echo "ANDROID_HOME=$ANDROID_HOME" >> "$GITHUB_ENV"
          echo "ANDROID_SDK_ROOT=$ANDROID_HOME" >> "$GITHUB_ENV"
          echo "$ANDROID_HOME/platform-tools" >> "$GITHUB_PATH"
          echo "$ANDROID_HOME/cmdline-tools/latest/bin" >> "$GITHUB_PATH"
          echo "$ANDROID_HOME/emulator" >> "$GITHUB_PATH"

          export PATH="$ANDROID_HOME/cmdline-tools/latest/bin:$PATH"

          java -version
          sdkmanager --version

          yes | sdkmanager --licenses >/dev/null || true

          sdkmanager --install \
            "platform-tools" \
            "platforms;android-35" \
            "emulator" \
            "system-images;android-35;google_apis;x86_64"

      # 6. Create Android 15 virtual device
      - name: Create Android 15 Emulator
        run: |
          set -e

          echo "no" | avdmanager create avd \
            --name CloudAndroid15 \
            --package "system-images;android-35;google_apis;x86_64" \
            --device "pixel_2" \
            --force

          mkdir -p "$HOME/.android"
          touch "$HOME/.android/repositories.cfg"

      # 7. Start virtual display
      - name: Start Desktop Display
        run: |
          export DISPLAY=:0

          Xvfb :0 -screen 0 1280x800x24 \
            -ac +extension GLX +render -noreset &

          sleep 3
          openbox &
          sleep 2

      # 8. Boot Android 15
      - name: Start Android Emulator
        run: |
          export DISPLAY=:0

          emulator \
            -avd CloudAndroid15 \
            -gpu swiftshader_indirect \
            -no-audio \
            -no-boot-anim \
            -accel off \
            -no-snapshot \
            -memory 2048 \
            -cores 2 \
            -skin 1080x1920 &

          adb wait-for-device

          echo "Waiting for Android boot..."

          for i in $(seq 1 180); do
            BOOT=$(adb shell getprop sys.boot_completed 2>/dev/null | tr -d '\r')

            if [ "$BOOT" = "1" ]; then
              echo "Android boot completed!"
              break
            fi

            if [ "$i" -eq 180 ]; then
              echo "Android boot timeout!"
              exit 1
            fi

            sleep 5
          done

          adb shell settings put global stay_on_while_plugged_in 3
          adb shell wm size 720x1280
          adb shell wm density 240

          adb devices

      # 9. Install APK files from apks folder
      - name: Install APK Files
        run: |
          shopt -s nullglob

          APK_FILES=(apks/*.apk)

          if [ ${#APK_FILES[@]} -eq 0 ]; then
            echo "No APK found. Skipping APK installation."
          else
            for APK in "${APK_FILES[@]}"; do
              echo "Installing: $APK"
              adb install -r "$APK"
            done
          fi

      # 10. Start VNC server
      - name: Start VNC Server
        env:
          VNC_PASSWORD: ${{ secrets.VNC_PASSWORD }}
        run: |
          if [ -z "$VNC_PASSWORD" ]; then
            echo "Missing VNC_PASSWORD GitHub secret!"
            exit 1
          fi

          x11vnc \
            -display :0 \
            -forever \
            -shared \
            -rfbport 5900 \
            -passwd "$VNC_PASSWORD" \
            -noxdamage \
            -repeat &

          sleep 3

      # 11. Connect private Tailscale network
      - name: Connect Tailscale
        uses: tailscale/github-action@v3
        with:
          authkey: ${{ secrets.TAILSCALE_AUTH_KEY }}

      # 12. Start browser VNC
      - name: Start noVNC Browser
        run: |
          websockify \
            --web=/usr/share/novnc \
            6080 \
            localhost:5900 &

          sleep 3

          echo "noVNC server started!"

      # 13. Show connection details
      - name: Android VNC Connection
        run: |
          IP=$(tailscale ip -4)

          echo "## Android 15 Cloud Emulator" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "Android OS: Android 15 (API 35)" >> "$GITHUB_STEP_SUMMARY"
          echo "Connection: Private Tailscale Network" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "### Open this URL:" >> "$GITHUB_STEP_SUMMARY"
          echo "http://${IP}:6080/vnc.html" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "VNC Password: Your VNC_PASSWORD secret" >> "$GITHUB_STEP_SUMMARY"

          echo "=================================="
          echo "ANDROID 15 IS READY"
          echo "http://${IP}:6080/vnc.html"
          echo "=================================="

      # 14. Keep Android running
      - name: Keep Android Alive
        run: |
          echo "Android 15 is running."
          sleep 20000
