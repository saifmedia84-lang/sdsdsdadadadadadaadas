
name: Android 15 Cloud Phone

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: android-cloud-phone
  cancel-in-progress: true

jobs:
  android-cloud:
    runs-on: ubuntu-22.04
    timeout-minutes: 350

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # FIX: Force JDK 17
      - name: Install Java 17
        shell: bash
        run: |
          sudo apt-get update
          sudo apt-get install -y openjdk-17-jdk

          echo "JAVA_HOME=/usr/lib/jvm/java-17-openjdk-amd64" >> "$GITHUB_ENV"
          echo "/usr/lib/jvm/java-17-openjdk-amd64/bin" >> "$GITHUB_PATH"

          export JAVA_HOME=/usr/lib/jvm/java-17-openjdk-amd64
          export PATH="$JAVA_HOME/bin:$PATH"

          java -version

      - name: Install Linux Dependencies
        run: |
          sudo apt-get install -y \
            xvfb x11vnc novnc websockify \
            wget unzip curl

      # Android SDK
      - name: Setup Android SDK
        shell: bash
        run: |
          export JAVA_HOME=/usr/lib/jvm/java-17-openjdk-amd64
          export PATH="$JAVA_HOME/bin:$PATH"

          java -version

          export ANDROID_HOME="$HOME/android-sdk"
          mkdir -p "$ANDROID_HOME/cmdline-tools"

          wget -q \
            https://dl.google.com/android/repository/commandlinetools-linux-13114758_latest.zip \
            -O /tmp/android-sdk.zip

          unzip -q /tmp/android-sdk.zip -d /tmp/android-cmd

          mkdir -p "$ANDROID_HOME/cmdline-tools/latest"

          mv /tmp/android-cmd/cmdline-tools/* \
            "$ANDROID_HOME/cmdline-tools/latest/"

          echo "ANDROID_HOME=$ANDROID_HOME" >> "$GITHUB_ENV"
          echo "$ANDROID_HOME/platform-tools" >> "$GITHUB_PATH"
          echo "$ANDROID_HOME/emulator" >> "$GITHUB_PATH"
          echo "$ANDROID_HOME/cmdline-tools/latest/bin" >> "$GITHUB_PATH"

          SDKMANAGER="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"

          yes | "$SDKMANAGER" --licenses >/dev/null || true

          "$SDKMANAGER" \
            "platform-tools" \
            "platforms;android-35" \
            "emulator" \
            "system-images;android-35;google_apis;x86_64"

      # Android 15 AVD
      - name: Create Android 15 Emulator
        shell: bash
        run: |
          echo "no" | avdmanager create avd \
            -n CloudAndroid15 \
            -k "system-images;android-35;google_apis;x86_64" \
            --device "pixel_2"

      # Start Android
      - name: Start Android 15
        shell: bash
        run: |
          export DISPLAY=:0

          Xvfb :0 -screen 0 1280x800x24 &
          sleep 3

          emulator -avd CloudAndroid15 \
            -gpu swiftshader_indirect \
            -no-audio \
            -no-boot-anim \
            -accel off \
            -no-snapshot \
            > emulator.log 2>&1 &

          adb wait-for-device

          BOOTED=false

          for i in $(seq 1 180); do
            if [ "$(adb shell getprop sys.boot_completed 2>/dev/null | tr -d '\r')" = "1" ]; then
              BOOTED=true
              break
            fi
            sleep 5
          done

          if [ "$BOOTED" != "true" ]; then
            echo "Android boot failed"
            tail -100 emulator.log
            exit 1
          fi

          adb shell wm size 1280x800
          adb shell wm density 240

          echo "Android 15 is ready!"
          adb shell getprop ro.build.version.release

      # Optional APK installation
      - name: Install APK
        shell: bash
        run: |
          if [ -d "apks" ] && compgen -G "apks/*.apk" > /dev/null; then
            for apk in apks/*.apk; do
              echo "Installing $apk"
              adb install -r "$apk"
            done
          else
            echo "No APK found. Skipping."
          fi

      # VNC password
      - name: Configure VNC
        shell: bash
        env:
          VNC_PASSWORD: ${{ secrets.VNC_PASSWORD }}
        run: |
          if [ -z "$VNC_PASSWORD" ]; then
            echo "Missing VNC_PASSWORD secret"
            exit 1
          fi

          mkdir -p "$HOME/.vnc"

          x11vnc -storepasswd \
            "$VNC_PASSWORD" \
            "$HOME/.vnc/passwd"

      # Start VNC
      - name: Start VNC Server
        shell: bash
        run: |
          x11vnc \
            -display :0 \
            -forever \
            -shared \
            -rfbport 5900 \
            -rfbauth "$HOME/.vnc/passwd" \
            -noxdamage \
            > vnc.log 2>&1 &

          sleep 3

      # Tailscale
      - name: Connect Tailscale
        uses: tailscale/github-action@v3
        with:
          authkey: ${{ secrets.TAILSCALE_AUTH_KEY }}
          args: --hostname=android15-cloud-${{ github.run_id }}

      # Browser VNC
      - name: Start Browser VNC
        shell: bash
        run: |
          websockify \
            --web=/usr/share/novnc \
            6080 \
            localhost:5900 \
            > novnc.log 2>&1 &

          sleep 5

          TS_IP=$(tailscale ip -4 | head -n 1)

          if [ -z "$TS_IP" ]; then
            echo "Tailscale IP missing"
            exit 1
          fi

          echo "===================================="
          echo "ANDROID 15 CLOUD PHONE READY"
          echo "Browser: http://$TS_IP:6080/vnc.html"
          echo "VNC Password: Your GitHub Secret"
          echo "===================================="

          echo "TAILSCALE_IP=$TS_IP" >> "$GITHUB_ENV"

      # Keep alive
      - name: Keep Android Running
        shell: bash
        run: |
          while true; do
            echo "Android 15 Cloud Phone is running"
            adb get-state
            sleep 60
          done
