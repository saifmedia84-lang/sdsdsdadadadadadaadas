
name: Android 15 Cloud VNC

on:
  workflow_dispatch:

permissions:
  contents: read

env:
  SDK_CACHE_KEY: android-sdk-api35-google-apis-x86_64-v3
  AVD_NAME: CloudAndroid15

jobs:
  android-cloud:
    name: Android 15 Emulator
    runs-on: ubuntu-22.04
    timeout-minutes: 350

    steps:
      # 1. Checkout
      - name: Checkout Repository
        uses: actions/checkout@v4

      # 2. Java
      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      # 3. KVM
      - name: Enable KVM
        shell: bash
        run: |
          set -e

          if [ ! -e /dev/kvm ]; then
            echo "ERROR: /dev/kvm unavailable."
            exit 1
          fi

          sudo chmod 666 /dev/kvm
          ls -l /dev/kvm

      # 4. Dependencies
      - name: Install Dependencies
        run: |
          sudo apt-get update

          sudo apt-get install -y \
            curl unzip xvfb x11vnc openbox \
            novnc websockify x11-utils \
            netcat-openbsd libpulse0 libnss3 \
            libx11-6 libxcb1 libxcomposite1 \
            libxcursor1 libxi6 libxrender1 \
            libxtst6 libxrandr2 libasound2 \
            libgl1 libegl1 libfontconfig1 \
            libdbus-1-3 libxkbcommon0 \
            libgbm1 libdrm2 libexpat1

      # 5. Restore SDK Cache
      - name: Restore Android SDK Cache
        id: sdk-cache
        uses: actions/cache/restore@v4
        with:
          path: ~/android-sdk
          key: ${{ env.SDK_CACHE_KEY }}

      # 6. Android SDK
      - name: Setup Android SDK
        shell: bash
        run: |
          set -e

          export ANDROID_HOME="$HOME/android-sdk"
          export ANDROID_SDK_ROOT="$ANDROID_HOME"

          mkdir -p "$ANDROID_HOME/cmdline-tools"

          if [ ! -x "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" ]; then
            cd "$ANDROID_HOME"

            curl -fL \
              https://dl.google.com/android/repository/commandlinetools-linux-13114758_latest.zip \
              -o tools.zip

            unzip -q tools.zip

            mkdir -p cmdline-tools/latest

            mv cmdline-tools/bin cmdline-tools/latest/
            mv cmdline-tools/lib cmdline-tools/latest/

            [ ! -f cmdline-tools/NOTICE.txt ] || \
              mv cmdline-tools/NOTICE.txt cmdline-tools/latest/

            [ ! -f cmdline-tools/source.properties ] || \
              mv cmdline-tools/source.properties cmdline-tools/latest/

            rm -f tools.zip
          fi

          {
            echo "ANDROID_HOME=$ANDROID_HOME"
            echo "ANDROID_SDK_ROOT=$ANDROID_HOME"
          } >> "$GITHUB_ENV"

          {
            echo "$ANDROID_HOME/platform-tools"
            echo "$ANDROID_HOME/emulator"
            echo "$ANDROID_HOME/cmdline-tools/latest/bin"
          } >> "$GITHUB_PATH"

          export PATH="$ANDROID_HOME/cmdline-tools/latest/bin:$PATH"

          java -version
          sdkmanager --version

          yes | sdkmanager --licenses >/dev/null || true

          sdkmanager --install \
            "platform-tools" \
            "platforms;android-35" \
            "emulator" \
            "system-images;android-35;google_apis;x86_64"

      # 7. Save SDK Cache
      - name: Save Android SDK Cache
        if: steps.sdk-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: ~/android-sdk
          key: ${{ env.SDK_CACHE_KEY }}

      # 8. Create AVD
      - name: Create Android 15 AVD
        shell: bash
        run: |
          set -e

          export ANDROID_HOME="$HOME/android-sdk"
          export ANDROID_SDK_ROOT="$ANDROID_HOME"
          export ANDROID_AVD_HOME="$HOME/.android/avd"
          export PATH="$ANDROID_HOME/cmdline-tools/latest/bin:$PATH"

          mkdir -p "$ANDROID_AVD_HOME"
          touch "$HOME/.android/repositories.cfg"

          echo "no" | avdmanager create avd \
            --name "$AVD_NAME" \
            --package "system-images;android-35;google_apis;x86_64" \
            --device "pixel_2" \
            --force

          CONFIG="$ANDROID_AVD_HOME/$AVD_NAME.avd/config.ini"

          test -f "$CONFIG"

          sed -i -E \
            '/^(hw\.lcd\.(width|height|density)|skin\.(name|path|dynamic)|hw\.ramSize|hw\.cpu\.ncore|vm\.heapSize|hw\.keyboard|disk\.dataPartition\.size)=/d' \
            "$CONFIG"

          cat >> "$CONFIG" <<'EOF'
          hw.lcd.width=720
          hw.lcd.height=1280
          hw.lcd.density=240
          hw.ramSize=4096
          hw.cpu.ncore=4
          vm.heapSize=512
          hw.keyboard=yes
          disk.dataPartition.size=8G
          EOF

          echo "ANDROID_AVD_HOME=$ANDROID_AVD_HOME" >> "$GITHUB_ENV"

          avdmanager list avd

          test -f "$ANDROID_AVD_HOME/$AVD_NAME.ini"

      # 9. Desktop Display
      - name: Start Desktop Display
        shell: bash
        run: |
          set -e

          export DISPLAY=:0
          echo "DISPLAY=:0" >> "$GITHUB_ENV"

          nohup Xvfb :0 \
            -screen 0 1280x1400x24 \
            -ac +extension GLX +render -noreset \
            > "$HOME/xvfb.log" 2>&1 &

          for i in $(seq 1 30); do
            if xdpyinfo -display :0 >/dev/null 2>&1; then
              break
            fi
            sleep 1
          done

          xdpyinfo -display :0 >/dev/null

          nohup openbox \
            > "$HOME/openbox.log" 2>&1 &

          sleep 2

      # 10. Start Emulator
      - name: Start Android Emulator
        shell: bash
        run: |
          set -e

          export DISPLAY=:0
          export ANDROID_HOME="$HOME/android-sdk"
          export ANDROID_AVD_HOME="$HOME/.android/avd"

          export PATH="$ANDROID_HOME/emulator:$ANDROID_HOME/platform-tools:$PATH"

          test -f "$ANDROID_AVD_HOME/$AVD_NAME.ini"

          emulator -list-avds

          nohup emulator \
            -avd "$AVD_NAME" \
            -accel on \
            -gpu swiftshader_indirect \
            -no-audio \
            -no-boot-anim \
            -no-snapshot \
            -netfast \
            > "$HOME/emulator.log" 2>&1 &

          EMU_PID=$!
          echo "EMU_PID=$EMU_PID" >> "$GITHUB_ENV"

          adb start-server

          echo "Waiting for ADB..."

          FOUND=0

          for i in $(seq 1 60); do

            if ! kill -0 "$EMU_PID" 2>/dev/null; then
              echo "Emulator stopped!"
              cat "$HOME/emulator.log"
              exit 1
            fi

            if adb devices | grep -q "emulator-5554"; then
              FOUND=1
              break
            fi

            sleep 5
          done

          if [ "$FOUND" -ne 1 ]; then
            echo "ADB connection timeout!"
            cat "$HOME/emulator.log"
            exit 1
          fi

          timeout 300 adb -s emulator-5554 wait-for-device

          echo "Waiting for Android boot..."

          BOOTED=0

          for i in $(seq 1 180); do

            if ! kill -0 "$EMU_PID" 2>/dev/null; then
              echo "Emulator stopped during boot!"
              cat "$HOME/emulator.log"
              exit 1
            fi

            BOOT=$(adb -s emulator-5554 shell \
              getprop sys.boot_completed 2>/dev/null \
              | tr -d '\r' || true)

            if [ "$BOOT" = "1" ]; then
              BOOTED=1
              break
            fi

            sleep 5
          done

          if [ "$BOOTED" -ne 1 ]; then
            echo "Android boot timeout!"
            cat "$HOME/emulator.log"
            adb logcat -d -t 300 || true
            exit 1
          fi

          adb -s emulator-5554 shell wm size 720x1280
          adb -s emulator-5554 shell wm density 240

          adb -s emulator-5554 shell \
            settings put global stay_on_while_plugged_in 3

          adb -s emulator-5554 shell \
            settings put system screen_off_timeout 2147483647

          adb -s emulator-5554 shell input keyevent 82 || true

          echo "Android 15 booted successfully!"

          adb devices

      # 11. Install APKs
      - name: Install APK Files
        shell: bash
        run: |
          shopt -s nullglob

          APK_FILES=(apks/*.apk)

          if [ ${#APK_FILES[@]} -eq 0 ]; then
            echo "No APK files found. Skipping."
            exit 0
          fi

          FAILED=0

          for APK in "${APK_FILES[@]}"; do

            echo "Installing $APK"

            if adb -s emulator-5554 install -r "$APK"; then
              echo "Installed: $APK"
            else
              echo "::warning::Failed to install $APK"
              FAILED=$((FAILED + 1))
            fi

          done

          echo "APK installation finished."
          echo "Failed APKs: $FAILED"

      # 12. VNC Server
      - name: Start VNC Server
        env:
          VNC_PASSWORD: ${{ secrets.VNC_PASSWORD }}
        shell: bash
        run: |
          set -e

          if [ -z "$VNC_PASSWORD" ]; then
            echo "VNC_PASSWORD secret is missing!"
            exit 1
          fi

          mkdir -p "$HOME/.vnc"

          umask 077

          x11vnc -storepasswd \
            "$VNC_PASSWORD" \
            "$HOME/.vnc/passwd"

          chmod 600 "$HOME/.vnc/passwd"

          unset VNC_PASSWORD

          nohup x11vnc \
            -display :0 \
            -forever \
            -shared \
            -rfbport 5900 \
            -localhost \
            -rfbauth "$HOME/.vnc/passwd" \
            -noxdamage \
            -repeat \
            > "$HOME/x11vnc.log" 2>&1 &

          for i in $(seq 1 30); do

            if nc -z 127.0.0.1 5900; then
              echo "VNC server is ready!"
              break
            fi

            sleep 1
          done

          nc -z 127.0.0.1 5900 || {
            cat "$HOME/x11vnc.log"
            exit 1
          }

      # 13. Tailscale
      - name: Connect Tailscale
        uses: tailscale/github-action@v3
        with:
          authkey: ${{ secrets.TAILSCALE_AUTH_KEY }}
          args: --hostname=android-cloud-${{ github.run_id }}

      # 14. noVNC
      - name: Start noVNC Browser
        shell: bash
        run: |
          set -e

          TS_IP=$(tailscale ip -4 | head -n1)

          if [ -z "$TS_IP" ]; then
            echo "Tailscale IP unavailable!"
            exit 1
          fi

          echo "TS_IP=$TS_IP" >> "$GITHUB_ENV"

          nohup websockify \
            --web=/usr/share/novnc \
            "${TS_IP}:6080" \
            127.0.0.1:5900 \
            > "$HOME/novnc.log" 2>&1 &

          for i in $(seq 1 30); do

            if nc -z "$TS_IP" 6080; then
              echo "noVNC is ready!"
              break
            fi

            sleep 1
          done

          nc -z "$TS_IP" 6080 || {
            cat "$HOME/novnc.log"
            exit 1
          }

      # 15. Connection Details
      - name: Show Connection Details
        shell: bash
        run: |
          URL="http://${TS_IP}:6080/vnc.html"

          {
            echo "## Android 15 Cloud Emulator"
            echo ""
            echo "- OS: Android 15 (API 35)"
            echo "- Display: 720x1280"
            echo "- RAM: 4GB"
            echo "- CPU: 4 cores"
            echo "- Connection: Tailscale private network"
            echo ""
            echo "### Browser VNC"
            echo "$URL"
            echo ""
            echo "### VNC Password"
            echo "Use your configured VNC_PASSWORD secret."
          } >> "$GITHUB_STEP_SUMMARY"

          echo "Android is ready!"
          echo "$URL"

      # 16. Keep Alive
      - name: Keep Android Running
        shell: bash
        run: |
          while true; do

            if ! adb -s emulator-5554 get-state >/dev/null 2>&1; then
              echo "Android emulator stopped!"
              cat "$HOME/emulator.log"
              exit 1
            fi

            if ! nc -z 127.0.0.1 5900; then
              echo "VNC server stopped!"
              cat "$HOME/x11vnc.log"
              exit 1
            fi

            if ! nc -z "$TS_IP" 6080; then
              echo "noVNC stopped!"
              cat "$HOME/novnc.log"
              exit 1
            fi

            sleep 60
          done
