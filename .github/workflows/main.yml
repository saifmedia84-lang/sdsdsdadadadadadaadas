
name: Android 15 Cloud Emulator VNC

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  android-cloud:
    name: Android 15 Cloud
    runs-on: ubuntu-22.04
    timeout-minutes: 350

    steps:
      # 1. Checkout
      - name: Checkout Repository
        uses: actions/checkout@v4

      # 2. Java 17
      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      # 3. Dependencies
      - name: Install Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            curl unzip xvfb x11vnc openbox \
            novnc websockify

      # 4. Verify Java
      - name: Verify Java
        run: |
          java -version
          echo "JAVA_HOME=$JAVA_HOME"

      # 5. Android SDK
      - name: Setup Android SDK
        shell: bash
        run: |
          set -e

          export ANDROID_HOME="$HOME/android-sdk"
          export ANDROID_SDK_ROOT="$ANDROID_HOME"

          mkdir -p "$ANDROID_HOME/cmdline-tools"

          cd "$ANDROID_HOME"

          curl -fL \
            https://dl.google.com/android/repository/commandlinetools-linux-13114758_latest.zip \
            -o tools.zip

          unzip -q tools.zip

          mkdir -p cmdline-tools/latest

          mv cmdline-tools/bin cmdline-tools/latest/
          mv cmdline-tools/lib cmdline-tools/latest/

          if [ -f cmdline-tools/NOTICE.txt ]; then
            mv cmdline-tools/NOTICE.txt cmdline-tools/latest/
          fi

          if [ -f cmdline-tools/source.properties ]; then
            mv cmdline-tools/source.properties cmdline-tools/latest/
          fi

          rm -f tools.zip

          echo "ANDROID_HOME=$ANDROID_HOME" >> "$GITHUB_ENV"
          echo "ANDROID_SDK_ROOT=$ANDROID_HOME" >> "$GITHUB_ENV"

          echo "$ANDROID_HOME/platform-tools" >> "$GITHUB_PATH"
          echo "$ANDROID_HOME/emulator" >> "$GITHUB_PATH"
          echo "$ANDROID_HOME/cmdline-tools/latest/bin" >> "$GITHUB_PATH"

          export PATH="$ANDROID_HOME/cmdline-tools/latest/bin:$PATH"

          java -version
          sdkmanager --version

          yes | sdkmanager --licenses >/dev/null || true

          sdkmanager --install \
            "platform-tools" \
            "platforms;android-35" \
            "emulator" \
            "system-images;android-35;google_apis;x86_64"

      # 6. Create AVD
      - name: Create Android 15 AVD
        shell: bash
        run: |
          set -e

          export ANDROID_HOME="$HOME/android-sdk"
          export ANDROID_SDK_ROOT="$ANDROID_HOME"
          export ANDROID_AVD_HOME="$HOME/.android/avd"

          export PATH="$ANDROID_HOME/cmdline-tools/latest/bin:$ANDROID_HOME/emulator:$ANDROID_HOME/platform-tools:$PATH"

          mkdir -p "$ANDROID_AVD_HOME"

          touch "$HOME/.android/repositories.cfg"

          echo "no" | avdmanager create avd \
            --name CloudAndroid15 \
            --package "system-images;android-35;google_apis;x86_64" \
            --device "pixel_2" \
            --force

          echo "ANDROID_AVD_HOME=$ANDROID_AVD_HOME" >> "$GITHUB_ENV"

          echo "Checking AVD files..."
          avdmanager list avd
          ls -la "$ANDROID_AVD_HOME"

          test -f "$ANDROID_AVD_HOME/CloudAndroid15.ini"

          echo "AVD successfully created!"

      # 7. Desktop display
      - name: Start Desktop Display
        run: |
          Xvfb :0 -screen 0 1280x800x24 \
            -ac +extension GLX +render -noreset &

          sleep 3

          openbox &
          sleep 2

      # 8. Start Android Emulator
      - name: Start Android Emulator
        shell: bash
        run: |
          set -e

          export DISPLAY=:0
          export ANDROID_HOME="$HOME/android-sdk"
          export ANDROID_AVD_HOME="$HOME/.android/avd"

          export PATH="$ANDROID_HOME/emulator:$ANDROID_HOME/platform-tools:$PATH"

          echo "Available AVDs:"
          emulator -list-avds

          test -f "$ANDROID_AVD_HOME/CloudAndroid15.ini"

          emulator \
            -avd CloudAndroid15 \
            -gpu swiftshader_indirect \
            -no-audio \
            -no-boot-anim \
            -accel off \
            -no-snapshot \
            -memory 2048 \
            -cores 2 &

          echo "Waiting for ADB..."

          adb wait-for-device

          echo "Waiting for Android boot..."

          BOOTED=0

          for i in $(seq 1 180); do
            BOOT=$(adb shell getprop sys.boot_completed 2>/dev/null | tr -d '\r')

            if [ "$BOOT" = "1" ]; then
              BOOTED=1
              break
            fi

            sleep 5
          done

          if [ "$BOOTED" -ne 1 ]; then
            echo "Android boot timeout!"
            adb logcat -d -t 300 || true
            exit 1
          fi

          adb shell wm size 720x1280
          adb shell wm density 240
          adb shell settings put global stay_on_while_plugged_in 3

          echo "Android 15 is ready!"
          adb devices

      # 9. Install APKs
      - name: Install APK Files
        shell: bash
        run: |
          shopt -s nullglob
          APK_FILES=(apks/*.apk)

          if [ ${#APK_FILES[@]} -eq 0 ]; then
            echo "No APK files found. Skipping."
          else
            for APK in "${APK_FILES[@]}"; do
              echo "Installing $APK"
              adb install -r "$APK"
            done
          fi

      # 10. VNC Server
      - name: Start VNC Server
        env:
          VNC_PASSWORD: ${{ secrets.VNC_PASSWORD }}
        run: |
          set -e

          if [ -z "$VNC_PASSWORD" ]; then
            echo "VNC_PASSWORD secret is missing!"
            exit 1
          fi

          mkdir -p "$HOME/.vnc"

          x11vnc -storepasswd \
            "$VNC_PASSWORD" \
            "$HOME/.vnc/passwd"

          chmod 600 "$HOME/.vnc/passwd"

          x11vnc \
            -display :0 \
            -forever \
            -shared \
            -rfbport 5900 \
            -rfbauth "$HOME/.vnc/passwd" \
            -noxdamage \
            -repeat &

          sleep 3

      # 11. Tailscale
      - name: Connect Tailscale
        uses: tailscale/github-action@v3
        with:
          authkey: ${{ secrets.TAILSCALE_AUTH_KEY }}

      # 12. Browser VNC
      - name: Start noVNC
        run: |
          websockify \
            --web=/usr/share/novnc \
            6080 \
            localhost:5900 &

          sleep 3

          echo "noVNC started!"

      # 13. Connection URL
      - name: Show Android Connection
        run: |
          IP=$(tailscale ip -4)

          echo "## Android 15 Cloud Emulator" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "**Android:** Android 15 / API 35" >> "$GITHUB_STEP_SUMMARY"
          echo "**VNC:** Browser-based control" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "### Open this URL:" >> "$GITHUB_STEP_SUMMARY"
          echo "http://${IP}:6080/vnc.html" >> "$GITHUB_STEP_SUMMARY"

          echo "================================"
          echo "ANDROID 15 READY"
          echo "http://${IP}:6080/vnc.html"
          echo "================================"

      # 14. Keep session alive
      - name: Keep Android Running
        run: |
          echo "Android 15 Cloud is running."

          while true; do
            adb get-state
            sleep 60
          done

