
name: Android 15 Cloud VNC

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  android-cloud:
    name: Android 15 Emulator
    runs-on: ubuntu-22.04
    timeout-minutes: 350

    steps:
      # 1. Checkout
      - name: Checkout Repository
        uses: actions/checkout@v4

      # 2. Java 17
      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      # 3. Enable KVM
      - name: Enable KVM
        run: |
          if [ ! -e /dev/kvm ]; then
            echo "ERROR: /dev/kvm is unavailable on this runner."
            echo "Use a runner that supports hardware virtualization."
            exit 1
          fi

          sudo chmod 666 /dev/kvm
          ls -l /dev/kvm

      # 4. Install dependencies
      - name: Install Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            curl unzip xvfb x11vnc openbox \
            novnc websockify x11-utils \
            netcat-openbsd

      # 5. Cache Android SDK
      - name: Cache Android SDK
        uses: actions/cache@v4
        with:
          path: ~/android-sdk
          key: android-sdk-api35-google-apis-x86_64-v1

      # 6. Setup Android SDK
      - name: Setup Android SDK
        shell: bash
        run: |
          set -e

          export ANDROID_HOME="$HOME/android-sdk"
          export ANDROID_SDK_ROOT="$ANDROID_HOME"

          mkdir -p "$ANDROID_HOME/cmdline-tools"

          if [ ! -x "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" ]; then
            cd "$ANDROID_HOME"

            curl -fL \
              https://dl.google.com/android/repository/commandlinetools-linux-13114758_latest.zip \
              -o tools.zip

            unzip -q tools.zip

            mkdir -p cmdline-tools/latest

            mv cmdline-tools/bin cmdline-tools/latest/
            mv cmdline-tools/lib cmdline-tools/latest/

            [ ! -f cmdline-tools/NOTICE.txt ] || \
              mv cmdline-tools/NOTICE.txt cmdline-tools/latest/

            [ ! -f cmdline-tools/source.properties ] || \
              mv cmdline-tools/source.properties cmdline-tools/latest/

            rm -f tools.zip
          fi

          echo "ANDROID_HOME=$ANDROID_HOME" >> "$GITHUB_ENV"
          echo "ANDROID_SDK_ROOT=$ANDROID_HOME" >> "$GITHUB_ENV"
          echo "$ANDROID_HOME/platform-tools" >> "$GITHUB_PATH"
          echo "$ANDROID_HOME/emulator" >> "$GITHUB_PATH"
          echo "$ANDROID_HOME/cmdline-tools/latest/bin" >> "$GITHUB_PATH"

          export PATH="$ANDROID_HOME/cmdline-tools/latest/bin:$PATH"

          java -version
          sdkmanager --version

          yes | sdkmanager --licenses >/dev/null || true

          sdkmanager --install \
            "platform-tools" \
            "platforms;android-35" \
            "emulator" \
            "system-images;android-35;google_apis;x86_64"

      # 7. Create Android 15 AVD
      - name: Create Android 15 AVD
        shell: bash
        run: |
          set -e

          export ANDROID_HOME="$HOME/android-sdk"
          export ANDROID_SDK_ROOT="$ANDROID_HOME"
          export ANDROID_AVD_HOME="$HOME/.android/avd"

          export PATH="$ANDROID_HOME/cmdline-tools/latest/bin:$PATH"

          mkdir -p "$ANDROID_AVD_HOME"
          touch "$HOME/.android/repositories.cfg"

          echo "no" | avdmanager create avd \
            --name CloudAndroid15 \
            --package "system-images;android-35;google_apis;x86_64" \
            --device "pixel_2" \
            --force

          echo "ANDROID_AVD_HOME=$ANDROID_AVD_HOME" >> "$GITHUB_ENV"

          avdmanager list avd
          test -f "$ANDROID_AVD_HOME/CloudAndroid15.ini"

      # 8. Start virtual desktop
      - name: Start Desktop Display
        shell: bash
        run: |
          set -e

          export DISPLAY=:0
          echo "DISPLAY=:0" >> "$GITHUB_ENV"

          nohup Xvfb :0 \
            -screen 0 1280x1400x24 \
            -ac +extension GLX +render -noreset \
            > "$HOME/xvfb.log" 2>&1 &

          for i in $(seq 1 30); do
            if xdpyinfo -display :0 >/dev/null 2>&1; then
              break
            fi
            sleep 1
          done

          xdpyinfo -display :0 >/dev/null

          nohup openbox > "$HOME/openbox.log" 2>&1 &

      # 9. Start Android Emulator
      - name: Start Android Emulator
        shell: bash
        run: |
          set -e

          export DISPLAY=:0
          export ANDROID_HOME="$HOME/android-sdk"
          export ANDROID_AVD_HOME="$HOME/.android/avd"

          export PATH="$ANDROID_HOME/emulator:$ANDROID_HOME/platform-tools:$PATH"

          test -f "$ANDROID_AVD_HOME/CloudAndroid15.ini"

          echo "Available AVDs:"
          emulator -list-avds

          nohup emulator \
            -avd CloudAndroid15 \
            -accel on \
            -gpu swiftshader_indirect \
            -no-audio \
            -no-boot-anim \
            -no-snapshot \
            -memory 2048 \
            -cores 2 \
            -skin 720x1280 \
            > "$HOME/emulator.log" 2>&1 &

          echo "Waiting for ADB..."

          if ! timeout 300 adb wait-for-device; then
            echo "ADB connection failed."
            cat "$HOME/emulator.log"
            exit 1
          fi

          echo "Waiting for Android boot..."

          BOOTED=0

          for i in $(seq 1 180); do
            BOOT=$(adb shell getprop sys.boot_completed 2>/dev/null | tr -d '\r' || true)

            if [ "$BOOT" = "1" ]; then
              BOOTED=1
              break
            fi

            sleep 5
          done

          if [ "$BOOTED" -ne 1 ]; then
            echo "Android boot timeout!"
            cat "$HOME/emulator.log"
            adb logcat -d -t 300 || true
            exit 1
          fi

          adb shell wm size 720x1280
          adb shell wm density 240
          adb shell settings put global stay_on_while_plugged_in 3

          echo "Android 15 booted successfully!"
          adb devices

      # 10. Install APKs
      - name: Install APK Files
        shell: bash
        run: |
          shopt -s nullglob
          APK_FILES=(apks/*.apk)

          if [ ${#APK_FILES[@]} -eq 0 ]; then
            echo "No APK files found."
          else
            for APK in "${APK_FILES[@]}"; do
              echo "Installing $APK"
              adb install -r "$APK"
            done
          fi

      # 11. Start VNC
      - name: Start VNC Server
        env:
          VNC_PASSWORD: ${{ secrets.VNC_PASSWORD }}
        run: |
          set -e

          if [ -z "$VNC_PASSWORD" ]; then
            echo "VNC_PASSWORD secret is missing!"
            exit 1
          fi

          mkdir -p "$HOME/.vnc"

          x11vnc -storepasswd \
            "$VNC_PASSWORD" \
            "$HOME/.vnc/passwd"

          chmod 600 "$HOME/.vnc/passwd"

          nohup x11vnc \
            -display :0 \
            -forever \
            -shared \
            -rfbport 5900 \
            -rfbauth "$HOME/.vnc/passwd" \
            -noxdamage \
            -repeat \
            > "$HOME/x11vnc.log" 2>&1 &

          for i in $(seq 1 30); do
            if nc -z 127.0.0.1 5900; then
              echo "VNC server is ready!"
              break
            fi
            sleep 1
          done

          nc -z 127.0.0.1 5900

      # 12. Connect Tailscale
      - name: Connect Tailscale
        uses: tailscale/github-action@v3
        with:
          authkey: ${{ secrets.TAILSCALE_AUTH_KEY }}

      # 13. Start noVNC
      - name: Start noVNC Browser
        shell: bash
        run: |
          set -e

          nohup websockify \
            --web=/usr/share/novnc \
            6080 \
            127.0.0.1:5900 \
            > "$HOME/novnc.log" 2>&1 &

          for i in $(seq 1 30); do
            if nc -z 127.0.0.1 6080; then
              echo "noVNC is ready!"
              break
            fi
            sleep 1
          done

          nc -z 127.0.0.1 6080

      # 14. Connection details
      - name: Show Connection Details
        run: |
          IP=$(tailscale ip -4)

          URL="http://${IP}:6080/vnc.html"

          echo "## Android 15 Cloud Emulator" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "- OS: Android 15 (API 35)" >> "$GITHUB_STEP_SUMMARY"
          echo "- Display: 720x1280" >> "$GITHUB_STEP_SUMMARY"
          echo "- Connection: Tailscale private network" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "### Browser VNC" >> "$GITHUB_STEP_SUMMARY"
          echo "$URL" >> "$GITHUB_STEP_SUMMARY"

          echo "Android is ready!"
          echo "$URL"

      # 15. Keep session alive
      - name: Keep Android Running
        shell: bash
        run: |
          while true; do
            if ! adb get-state >/dev/null 2>&1; then
              echo "Android emulator stopped!"
              cat "$HOME/emulator.log"
              exit 1
            fi

            sleep 60
          done
